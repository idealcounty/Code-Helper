<title id="title">Coverage evidence</title><desc id="desc">Interview test evidence visualization generated from recorded JSON.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#1f2937}.title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}.label{font-size:14px}.value{font-size:14px;font-weight:700}.axis{font-size:12px;fill:#64748b}.grid{stroke:#e2e8f0;stroke-width:1}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}.pass{fill:#0f766e}.accent{fill:#0e7490}.warn{fill:#d97706}.muted{fill:#94a3b8}</style><rect width="1000" height="540" fill="#ffffff"/><text x="40" y="42" class="title">Coverage evidence</text><text x="40" y="68" class="subtitle">366 tests · line and branch coverage from pytest-cov</text><line x1="250.0" y1="100" x2="250.0" y2="430" class="grid"/><text x="250.0" y="456" text-anchor="middle" class="axis">0%</text><line x1="380.0" y1="100" x2="380.0" y2="430" class="grid"/><text x="380.0" y="456" text-anchor="middle" class="axis">20%</text><line x1="510.0" y1="100" x2="510.0" y2="430" class="grid"/><text x="510.0" y="456" text-anchor="middle" class="axis">40%</text><line x1="640.0" y1="100" x2="640.0" y2="430" class="grid"/><text x="640.0" y="456" text-anchor="middle" class="axis">60%</text><line x1="770.0" y1="100" x2="770.0" y2="430" class="grid"/><text x="770.0" y="456" text-anchor="middle" class="axis">80%</text><line x1="900.0" y1="100" x2="900.0" y2="430" class="grid"/><text x="900.0" y="456" text-anchor="middle" class="axis">100%</text><text x="230" y="153" text-anchor="end" class="label">Trace line baseline</text><rect x="250" y="129" width="377.4" height="32" rx="6" fill="#94a3b8"/><text x="639.4" y="153" class="value">58.06%</text><text x="230" y="245" text-anchor="end" class="label">pytest line</text><rect x="250" y="221" width="562.0" height="32" rx="6" fill="#0f766e"/><text x="824.0" y="245" class="value">86.46%</text><text x="230" y="337" text-anchor="end" class="label">pytest branch</text><rect x="250" y="313" width="487.5" height="32" rx="6" fill="#0e7490"/><text x="749.5" y="337" class="value">75%</text></svg>