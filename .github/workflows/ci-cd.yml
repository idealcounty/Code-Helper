name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]
      - name: Compile Python sources
        run: python -m compileall -q src evals scripts
      - name: Run test suite
        run: >-
          python -m pytest -q
          --cov=src/coding_agent
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:coverage-html
          --junitxml=junit.xml
      - name: Run credential and privacy audit
        run: python scripts/security_audit.py --output-dir security-results
      - name: Run API and WebSocket contract smoke
        if: matrix.python-version == '3.11'
        run: python scripts/api_contract_smoke.py --output-dir api-contract-results
      - name: Enforce deterministic Agent Eval baseline
        if: matrix.python-version == '3.11'
        run: >-
          python -m evals.runner
          --output-dir eval-results
          --compare evals/reports/baseline.json
      - name: Run Repo Map retrieval benchmark
        if: matrix.python-version == '3.11'
        run: python -m evals.retrieval_benchmark --output-dir retrieval-results
      - name: Run Algorithm Judge benchmark
        if: matrix.python-version == '3.11'
        run: python -m evals.algorithm_benchmark --output-dir algorithm-results
      - name: Run TaskProfile comparison
        if: matrix.python-version == '3.11'
        run: python -m evals.profile_comparison --output-dir profile-results
      - name: Run key invariant mutation smoke
        if: matrix.python-version == '3.11'
        run: python scripts/mutation_smoke.py --output-dir mutation-results
      - name: Upload Agent Eval report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: eval-results/*
          if-no-files-found: error
      - name: Upload test and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-python-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            coverage-html/**
            security-results/*
            api-contract-results/*
            mutation-results/*
          if-no-files-found: warn
      - name: Upload retrieval benchmark
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: retrieval-results/*
          if-no-files-found: error
      - name: Upload algorithm benchmark
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: algorithm-benchmark
          path: algorithm-results/*
          if-no-files-found: error
      - name: Upload TaskProfile comparison
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: profile-comparison
          path: profile-results/*
          if-no-files-found: error

  package:
    name: Build distributable package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade build && python -m build
      - name: Validate submission README
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("README.txt").read_text(encoding="utf-8")
          if len(text) > 1000:
              raise SystemExit(f"README.txt is {len(text)} characters; maximum is 1000")
          if re.search(r"(?:sk-|api[_-]?key\s*[:=]\s*[^` ]+)", text, re.I):
              raise SystemExit("README.txt appears to contain a credential")
          print(f"README.txt validated ({len(text)} characters)")
          PY
      - name: Validate distributions
        run: python -m pip install --upgrade twine && python -m twine check dist/*
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-helper-distributions
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: code-helper-distributions
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
