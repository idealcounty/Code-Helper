name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run test suite
        run: python -m pytest -q

  package:
    name: Build distributable package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade build && python -m build
      - name: Validate submission README
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("README.txt").read_text(encoding="utf-8")
          if len(text) > 1000:
              raise SystemExit(f"README.txt is {len(text)} characters; maximum is 1000")
          if re.search(r"(?:sk-|api[_-]?key\s*[:=]\s*[^` ]+)", text, re.I):
              raise SystemExit("README.txt appears to contain a credential")
          print(f"README.txt validated ({len(text)} characters)")
          PY
      - name: Validate distributions
        run: python -m pip install --upgrade twine && python -m twine check dist/*
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-helper-distributions
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: code-helper-distributions
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
