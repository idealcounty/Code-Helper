[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-helper"
version = "0.1.0"
description = "A self-contained local coding agent with traceable tool execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]
desktop = [
    "pywebview>=5,<6",
    "pyinstaller>=6,<7",
]

[project.scripts]
code-helper = "coding_agent.cli:main"
code-helper-web = "coding_agent.web.app:main"
code-helper-desktop = "coding_agent.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_agent = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
